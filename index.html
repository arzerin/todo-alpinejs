<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Alpine.js -- TodoMVC</title>

    <!-- TodoMVC CSS -->
    <link
        rel="stylesheet"
        href="node_modules/todomvc-common/base.css"
    >

    <link
        rel="stylesheet"
        href="node_modules/todomvc-app-css/index.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >

    <!-- Alpine.js 3 -->
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
</head>


<body>

    <!-- ============================================
         TODO APPLICATION
    ============================================= -->

    <section 
       x-data="todos()"
        class="todoapp"
    >

        <!-- ========================================
             HEADER
        ========================================= -->

        <header class="header">

            <h1>todos</h1>

            <input
                x-model="newTodo"
                @keyup.enter="addTodo"
                class="new-todo"
                placeholder="What needs to be done?"
                autofocus
            >

        </header>



        <section class="main" x-show="todos.length">

            <!-- Mark all todos complete -->

            <input
                id="toggle-all"
                class="toggle-all"
                type="checkbox"
            >

            <label for="toggle-all">
                Mark all as complete
            </label>


            <!-- ====================================
                 TODO LIST
            ===================================== -->

            <ul class="todo-list">

                <!-- =================================
                     ACTIVE TODO EXAMPLE
                ================================== -->

                <!--li>

                    <div class="view">

                        <input
                            class="toggle"
                            type="checkbox"
                        >

                        <label>
                            Buy a unicorn
                        </label>

                        <button class="destroy"></button>

                    </div>

                    <input
                        class="edit"
                        value="Buy a unicorn"
                    >

                </li-->
                <!--template x-for="todo in todos" :key="todo.id"></template-->
                <template x-for="todo in filteredTodos" :key="todo.id">
                    <li :class="{ 
                        editing: todo === editedTodo, 
                        completed: todo.completed
                    } " >

                        <div class="view">

                            <input 
                                x-model="todo.completed"
                                @click="todo.completed = ! todo.completed; /*completeTodo(todo);*/"
                                class="toggle"
                                type="checkbox"
                            >

                            <label 
                                x-text="todo.body"
                                @dblclick="editTodo(todo)"
                            >
                            </label>

                            <button
                                @click="deleteTodo(todo)"
                                class="destroy"
                            ></button>

                        </div>

                        <input
                            x-model="todo.body"
                            class="edit"
                            @keyup.enter="editComplete(todo)"
                            @keyup.escape="cancelEdit(todo)"
                            x-effect="
                                if (todo === editedTodo) {
                                    $nextTick(() => $el.focus())
                                }
                            "
                            
                        >

                    </li>

                </template>


            </ul>

        </section>


        <!-- ========================================
             FOOTER

             Normally hidden when there are
             no todos.
        ========================================= -->

        <footer class="footer"  x-show="todos.length">

            <!-- Number of active todos -->

            <span class="todo-count">

                <strong x-text="active.length"></strong> <span x-text="active.length === 1 ? 'item' : 'items'"></span> left

            </span>


            <!-- ====================================
                 FILTERS
            ===================================== -->

            <ul class="filters">

                <li>
                    <a
                        @click.prevent="filter = 'all'"

                        :class="{ selected: filter === 'all' }"
                        href="#/"
                    >
                        All
                    </a>
                </li>

                <li>
                    <a 
                        @click.prevent="filter = 'active'" 
                        :class="{ selected: filter === 'active' }"
                        href="#/active">
                        Active
                    </a>
                </li>

                <li>
                    <a 
                        @click.prevent="filter = 'completed'" 
                        :class="{ selected: filter === 'completed' }"
                        href="#/completed">
                        Completed
                    </a>
                </li>

            </ul>


            <button 
                x-show="completed.length"
                class="clear-completed"
                @click="todos = active"

            
            >
                Clear completed
            </button>

        </footer>

    </section>


    <!-- ============================================
         INFORMATION
    ============================================= -->

    <footer 
        class="info"
        x-show="true"
    >

        <p>
            Double-click to edit a todo
        </p>

        <p>
            Created by
            <a href="https://arzerin.com" target="_blank">
                Zerin
            </a>
        </p>

    </footer>


    <!-- ============================================
         JAVASCRIPT
    ============================================= -->

    <script src="node_modules/todomvc-common/base.js"></script>

    <script src="js/todos.js?v-1.0.2"></script>

</body>

</html>
