<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Alpine.js • TodoMVC</title>

    <!-- TodoMVC CSS -->
    <link
        rel="stylesheet"
        href="node_modules/todomvc-common/base.css"
    >

    <link
        rel="stylesheet"
        href="node_modules/todomvc-app-css/index.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >

    <!-- Alpine.js 3 -->
    <script
        defer
        src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
</head>


<body>

    <!-- ============================================
         TODO APPLICATION
    ============================================= -->

    <section 
       x-data="{
            todos: [],

            get active() {
                return this.todos.filter(todo => !todo.completed);
            },

            newTodo: '',

            addTodo() {

                if (this.newTodo.trim() === '') {
                    return;
                }

                this.todos.push({
                    id: this.todos.length + 1,
                    body: this.newTodo,
                    completed: false
                });

                this.newTodo = '';
            },

            deleteTodo(todo) {
                let position = this.todos.indexOf(todo);

                this.todos.splice(position, 1);
            },
            completeTodo (todo) {
                //alert ('hello');
                todo.completed = true;
            }
        }"
        class="todoapp"
    >

        <!-- ========================================
             HEADER
        ========================================= -->

        <header class="header">

            <h1>todos</h1>

            <input
                x-model="newTodo"
                @keyup.enter="addTodo"
                class="new-todo"
                placeholder="What needs to be done?"
                autofocus
            >

        </header>



        <section class="main" x-show="todos.length">

            <!-- Mark all todos complete -->

            <input
                id="toggle-all"
                class="toggle-all"
                type="checkbox"
            >

            <label for="toggle-all">
                Mark all as complete
            </label>


            <!-- ====================================
                 TODO LIST
            ===================================== -->

            <ul class="todo-list">

                <!-- =================================
                     ACTIVE TODO EXAMPLE
                ================================== -->

                <!--li>

                    <div class="view">

                        <input
                            class="toggle"
                            type="checkbox"
                        >

                        <label>
                            Buy a unicorn
                        </label>

                        <button class="destroy"></button>

                    </div>

                    <input
                        class="edit"
                        value="Buy a unicorn"
                    >

                </li-->
                <template x-for="todo in todos" :key="todo.id">
                    <li :class="{ completed: todo.completed} " >

                        <div class="view">

                            <input @click="completeTodo(todo)"
                                class="toggle"
                                type="checkbox"
                            >

                            <label x-text="todo.body"></label>

                            <button
                                @click="deleteTodo(todo)"
                                class="destroy"
                            ></button>

                        </div>

                        <input
                            class="edit"
                            :value="todo.body"
                        >

                    </li>

                </template>


            </ul>

        </section>


        <!-- ========================================
             FOOTER

             Normally hidden when there are
             no todos.
        ========================================= -->

        <footer class="footer"  x-show="true">

            <!-- Number of active todos -->

            <span class="todo-count">

                <strong x-text="active.length"></strong>

                item left

            </span>


            <!-- ====================================
                 FILTERS
            ===================================== -->

            <ul class="filters">

                <li>
                    <a
                        class="selected"
                        href="#/"
                    >
                        All
                    </a>
                </li>

                <li>
                    <a href="#/active">
                        Active
                    </a>
                </li>

                <li>
                    <a href="#/completed">
                        Completed
                    </a>
                </li>

            </ul>


            <!-- Hidden when there are no
                 completed todos -->

            <button class="clear-completed">
                Clear completed
            </button>

        </footer>

    </section>


    <!-- ============================================
         INFORMATION
    ============================================= -->

    <footer class="info">

        <p>
            Double-click to edit a todo
        </p>

        <p>
            Created by
            <a href="#">
                You
            </a>
        </p>

        <p>
            Part of
            <a href="#">
                TodoMVC
            </a>
        </p>

    </footer>


    <!-- ============================================
         JAVASCRIPT
    ============================================= -->

    <script src="node_modules/todomvc-common/base.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
